name: pages

# The project page (site/): built with the demo clips of the `demo-videos` release (never in git) and deployed to
# GitHub Pages. Needs Settings -> Pages -> Source: GitHub Actions. Uploading clips to a release does not trigger it:
# run it by hand then (Actions -> pages -> Run workflow, or: gh workflow run pages.yml).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "experiments/videos/clips.yaml"
      - "coupledcarla/__init__.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release runs on its tag, which the github-pages environment does not let deploy (only the default branch by
  # default): start this workflow again on the default branch instead (a workflow_dispatch from GITHUB_TOKEN runs).
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - name: Download the demo clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p videos
          gh release download demo-videos --repo "$GITHUB_REPOSITORY" --dir videos \
            --pattern '*.mp4' --pattern '*.jpg' --clobber
          ls -l videos
      - run: python site/build.py --videos videos --out _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
