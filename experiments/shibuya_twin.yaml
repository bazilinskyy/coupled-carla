# The Shibuya crossing (0.9 km) as a baked CARLA 1.0 level: the carla-digitaltwins twin ShibuyaCrossing made by the
# "twin of any place" pipeline from Japan's open data (GSI seamless photo and 5 m DEM, PLATEAU LoD2 buildings with their
# photo textures; OSM roads with the jp_urban profile), left-hand traffic, SUMO driving on the twin's own OpenDRIVE.
# Needs a CARLA 1.0 server that has the level (see README, "A twin of any place").
name: shibuya_twin

map:
  opendrive: twins/ShibuyaCrossing.xodr   # the twin's OpenDRIVE, copied next to the experiments (not in git)
  carla_level: ShibuyaCrossing
  name: shibuya_twin
  lefthand: true

server:
  quality: Epic

simulation:
  step: 0.02
  weather: CloudyNoon

traffic:            # the place's traffic: road-network demand at the trial's hour x CROWD's density, mix and cyclists
  cars_per_hour: auto
  bikes_per_hour: auto

participants:
  - role: driver
    vehicle: vehicle.lincoln.mkz_2020
    input: keyboard
    view: driver
    spawn: {lat: 35.65918, lon: 139.69926, heading: 330}   # west of the scramble crossing, heading into it
    route: [[35.6595, 139.70045], [35.6590, 139.7002]]     # across the crossing to the south

trials:
  - {duration_s: 300}
