# New York (Midtown), as real as Coupled CARLA gets: the twin NycMidtown (NYC 3D Building Model) with Google's Photorealistic 3D Tiles over it
# and the live data on: the sun and weather of now, traffic fitted to NYC DOT counts, MTA buses (GTFS-Realtime), Citi Bike docks, the NY DMV fleet.
# Needs YOUR Google Maps Platform key with billing on the server machine (README "Photorealistic tiles"; each level
# load is one billed root request) and the level data in the server's content pack. Without a key it runs on the twin.
name: nyc_real
map:
  opendrive: twins/NycMidtown.xodr
  carla_level: NycMidtown
  bbox:
  - 40.74861
  - -73.9923
  - 40.76119
  - -73.9757
  name: nyc_twin
  photoreal:
    provider: google
    carve: carriageway
  scenery:
    trees: false
    buildings: false
server:
  quality: Epic
simulation:
  step: 0.02
  time: now
  weather: real
traffic:
  cars_per_hour: auto
  bikes_per_hour: auto
  counts: auto
  walkers:
    count: auto
participants:
- role: driver
  vehicle: vehicle.lincoln.mkz_2020
  input: keyboard
  view: driver
  spawn:
    lat: 40.7565
    lon: -73.9862
pois:
- name: times_square
  lat: 40.758
  lon: -73.9855
- name: herald_square
  lat: 40.7497
  lon: -73.9877
- name: bryant_park
  lat: 40.7536
  lon: -73.9832
- name: grand_central
  lat: 40.7527
  lon: -73.9772
trials:
- duration_s: 300
