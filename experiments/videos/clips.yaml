# Demo video clips (tools/make_videos.py). Each clip runs one trial of an experiment headless with film cameras
# (coupledcarla/film.py) or bot stations (kind: stations, views composed into a grid), keeps frames on a grid of
# simulation time from start_s (trial time) for duration_s, and encodes a short mp4 with a poster and a preview.
#   python tools/make_videos.py render <name>      (one clip)      python tools/make_videos.py render --all
defaults:
  fps: 25
  size: [1920, 1080]          # full HD (frames rendered 2x supersampled, see film.py capture)
  crf: 20                      # visually clean; a 20 s clip is about 10-25 MB
  # capture cameras: no motion blur, less bloom (eHMI light lines), a darker auto exposure (0.9.16's pale OSM roads)
  attributes: {motion_blur_intensity: 0, motion_blur_max_distortion: 0, bloom_intensity: 0.3,
               exposure_compensation: -0.7, exposure_max_bright: 15}
  # soft daylight (the sun stands where it did at the clip's time); a clip's own weather replaces it
  weather: {cloudiness: 20, precipitation: 0, precipitation_deposits: 0, wetness: 0, wind_intensity: 10, fog_density: 0}

clips:
  - name: eindhoven_rush_hour
    title: Rush hour in Eindhoven
    place: Eindhoven centre, Netherlands
    role: driver (autopilot), chase camera
    when: weekday 17:15
    agents: SUMO cars from the Dutch register, cyclists, real bus lines at their timetable
    notice: dense mixed traffic around the station, buses of the real lines, cyclists sharing the road
    experiment: experiments/eindhoven_centre.yaml
    time: "2026-06-17 17:15"
    hold: {driver: 96}
    # a planned route (SUMO driver, sumodriver.py): Fellenoord, across Kennedyplein to the John F. Kennedylaan, on
    # towards Fuutlaan; the car enters SUMO at its spawn when the hold ends, with the rush hour already going
    patch: {participants: {driver: {route: [[51.44479, 5.48053], [51.4423, 5.4852]], vehicle: vehicle.toyota.prius}}}
    start_s: 100
    duration_s: 20
    camera: {kind: follow, target: driver, offset: [-8.5, 0, 3.4], look_ahead_m: 12, look_up_m: 1.5, smooth_s: 0.8}

  - name: eindhoven_pedestrian_ehmi
    title: Crossing in front of an automated car
    place: Eindhoven, east of the station
    role: pedestrian
    when: midday
    agents: the AV with its eHMI (front, roof, road, eyes), an oncoming AI car, a pedestrian crowd, SUMO traffic
    notice: the AV slows, shows I'M STOPPING, then GO AHEAD; its eyes follow the pedestrian
    experiment: experiments/eindhoven_crowd.yaml
    local: true
    time: "2026-09-20 12:30"
    start_s: 11
    duration_s: 9.5          # the walker steps off at 12 s, crosses in front of the yielding AV and reaches the far
    # pavement at 20 s; later the view is the wall of the house there
    attributes: {bloom_intensity: 0.08}      # the eHMI's light lines bloom otherwise
    camera: {kind: follow, target: pedestrian, offset: [0.22, 0, 0.72], look_ahead_m: 6, look_up_m: 0.7,
             smooth_s: 0.4, look_at: av1, look_weight: 0.8, look_smooth_s: 0.4, look_max_m: 160, fov: 80}

  - name: crossing_four_views
    title: Four people, one street
    place: Eindhoven, east of the station
    role: pedestrian, AV passenger, driver, drone pilot (four bot stations)
    when: midday
    agents: the AV with its eHMI and in-car displays, a driver behind it, a drone above, a crowd, SUMO traffic
    notice: the same moment from four stations, frame-locked in simulation time
    experiment: experiments/eindhoven_station_ux.yaml
    kind: stations
    attributes: {exposure_compensation: 0.3, exposure_max_bright: 13, bloom_intensity: 0.08}   # interiors; eHMI bloom
    time: "2026-09-20 12:30"
    start_s: 6
    duration_s: 20
    caption: {title: "Four people, one street", line: "Eindhoven  ·  four bot stations in one world"}
    stations:
      layout: [2, 2]
      views:
        - {role: pedestrian, label: Pedestrian}
        - {role: av_passenger, label: AV passenger, own: av1}
        - {role: driver, label: Driver}
        - {role: pilot, label: Drone pilot}
    set:
      traffic: {walkers: {count: 30, radius_m: 120}}
      sound: {record: false}
      participants:
        - role: pedestrian
          kind: pedestrian
          station: true
          spawn: {lat: 51.4428727, lon: 5.4889750, heading: 165}
          bot: {path: [[51.4427501, 5.4890203]], start_s: 12, speed: 1.4, look: av1}
        - role: av_passenger
          kind: av_passenger
          station: true
          agent: av1
          bot: {ehmi: [[13, yielding], [16, go], [21, driving]]}
          displays:
            centre: centre_screen
            hud: hud_speed
            messages:
              - {at: 10, seconds: 4, display: centre, text: "Pedestrian crossing ahead", color: "#FFD60A"}
        - role: driver
          kind: driver
          station: true
          vehicle: vehicle.lincoln.mkz_2020
          spawn: {lat: 51.4431683, lon: 5.4913458, heading: 255}
          displays: {cluster: true, hud: hud_speed}
        - role: pilot
          kind: drone
          station: true
          airframe: consumer
          mode: position
          view: fpv
          gimbal_pitch_deg: -36
          spawn: {lat: 51.44305, lon: 5.49020, heading: 255}     # over the street east of the crossing, facing it
          bot: {path: [[51.44305, 5.49020, 22], [51.44293, 5.48945, 22]], speed: 4, start_s: 0, land: false}

