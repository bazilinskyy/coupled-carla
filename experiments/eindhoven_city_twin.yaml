# Eindhoven as one baked CARLA 1.0 level: the carla-digitaltwins city twin EhvCity, everything inside the Ring road
# plus Veldhoven as one continuous World Partition level (about 7.5 x 8.9 km): the centre, the TU/e campus,
# Strijp-S, the PSV stadium, Meerhoven and Veldhoven with ASML. OSM roads with the nl_urban profile (lane markings,
# kerbs, sidewalks), AHN terrain, the PDOK aerial photo on the ground (8 cm source: 12 cm per pixel in the centre and
# on the campus, 24 cm elsewhere), 3DBAG buildings with a facade style from their BAG construction year and use,
# photo roofs and lit windows at night. SUMO drives on the twin's own OpenDRIVE; the scenery (Eindhoven's tree and
# street-light registers, BGT furniture, NDW signs, parked cars) streams in around the participants as on EhvCentre.
# Needs a CARLA 1.0 server that has the level (baked chunk by chunk with carla-digitaltwins ue/bake_city.py; see
# README) and the twin's OpenDRIVE copied to twins/EhvCity.xodr (not in git: 100+ MB).
# Three trials: the driver starts by the station, on the TU/e campus and in Veldhoven by ASML.
name: eindhoven_city_twin

map:
  opendrive: twins/EhvCity.xodr   # the twin's OpenDRIVE, copied next to the experiments (not in git: see README)
  carla_level: EhvCity
  bbox: [51.395, 5.380, 51.465, 5.509]

server:
  quality: Epic

simulation:
  step: 0.02
  weather: CloudyNoon
  # city-sized map: SUMO every 5th tick in a thread, asked only about what is near (bridge/pipeline.py), and the
  # scenery within 200 m (each mesh is an actor in every tick's snapshot)
  sumo_step: 0.1
  sumo_thread: true
  sumo_near: true
  scenery: {radius_m: 200}

traffic:
  crop_radius_m: 1500   # SUMO on the roads within 1.5 km of the start, the city's demand cut to them (sumocrop.py)
  cars_per_hour: 20000   # half the centre twin's density (2,400 an hour on 4 km2): the suburbs are quieter
  bikes_per_hour: 6000

participants:
  - role: driver
    vehicle: vehicle.lincoln.mkz_2020
    input: keyboard
    view: driver
    spawn: {lat: 51.44453, lon: 5.47883}   # Fellenoord by the station

pois:
  - {name: eindhoven_centraal, lat: 51.4433, lon: 5.4797}
  - {name: 18_septemberplein, lat: 51.4385, lon: 5.4780}
  - {name: tue_atlas, lat: 51.4478, lon: 5.4860}
  - {name: philips_stadion, lat: 51.4417, lon: 5.4674}
  - {name: strijp_s, lat: 51.4487, lon: 5.4573}
  - {name: meerhoven, lat: 51.4405, lon: 5.4130}
  - {name: asml_veldhoven, lat: 51.4060, lon: 5.4125}

trials:
  - {duration_s: 300}
  - {duration_s: 300, patch: {participants: {driver: {spawn: {lat: 51.44790, lon: 5.48800}}}}}   # TU/e campus, De Zaale
  - {duration_s: 300, patch: {participants: {driver: {spawn: {lat: 51.40670, lon: 5.41480}}}}}   # Veldhoven, De Run by ASML
