# Helsinki's Senate Square and the Esplanadi (1 km) as a baked CARLA 1.0 level: the carla-digitaltwins twin
# HelsinkiSenate made by the "twin of any place" pipeline from global open data (Finland has no national entry: Overture
# buildings, AWS terrain tiles, no aerial photo; OSM roads), with SUMO driving on the twin's own OpenDRIVE.
# One of the "most realistic twin" examples: Google Photorealistic 3D Tiles can be streamed over it (map.photoreal, see
# eindhoven_twin_photoreal.yaml); the level data for that is written by `python -m coupledcarla.photoreal prepare`.
# Needs a CARLA 1.0 server that has the level (see README, "A twin of any place").
name: helsinki_twin

map:
  opendrive: twins/HelsinkiSenate.xodr   # the twin's OpenDRIVE, copied next to the experiments (not in git)
  carla_level: HelsinkiSenate
  name: helsinki_twin
  lefthand: false

server:
  quality: Epic

simulation:
  step: 0.02
  weather: CloudyNoon

traffic:
  cars_per_hour: auto
  bikes_per_hour: auto

participants:
  - role: driver
    vehicle: vehicle.lincoln.mkz_2020
    input: keyboard
    view: driver
    spawn: {lat: 60.16716, lon: 24.94784, heading: 87}   # on the Eteläesplanadi, heading east towards the Market Square

trials:
  - {duration_s: 300}
