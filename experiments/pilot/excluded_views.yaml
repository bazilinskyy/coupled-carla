# a twin cannot match them however good it is. Looked at one by one (24 Nov 2026, the photos of rounds r40/r41 and
# the Wikimedia Commons thumbnails); never deleted from the frozen sets. Kinds: indoors; a close-up of one object;
# people filling the frame; a view from high up; sky only. Photos with no ground (road + sidewalk < 3 %) and no sky
# (< 2 %) in their own labels are left out without being listed (realism_check.not_street).
