# Four people in one Town10 street: a pedestrian crosses the avenue mid-block (CARLA x -45, y 78) in front of an
# automated vehicle (AV) whose passenger sets its eHMI, a manual driver follows the AV, and a drone pilot watches from
# above. Four humans at four stations (or bots), plus SUMO traffic, a crowd and CARLA's AI walkers.
#   host:      python -m coupledcarla.run experiments/towns/town10_coupled.yaml
#   stations:  python -m coupledcarla.station --host <host> --role pedestrian
#              python -m coupledcarla.station --host <host> --role av_passenger
#              python -m coupledcarla.station --host <host> --role driver --input wheel
#              python -m coupledcarla.station --host <host> --role pilot --input gamepad
#   quick test without stations: python -m coupledcarla.run experiments/towns/town10_coupled.yaml --local --headless
name: town10_coupled

map:
  carla_town: Town10HD_Opt

simulation:
  weather: CloudyNoon

traffic:
  cars_per_hour: 700
  walkers: {count: 20, ai: {count: 30, radius_m: 120}}

coupling:
  port: 2100
  wait_for_stations_s: 600
  visual_sync_at_s: [2]

ehmi:
  states:
    yielding: {text: "I'M STOPPING", color: [0, 190, 255]}
    go: {text: "GO AHEAD", color: [0, 230, 120]}
    driving: {text: "DRIVING", color: [255, 170, 0]}
    wait: {text: "WAIT", color: [255, 40, 40]}

eye_contact: {angle_deg: 20, distance_m: 30}

participants:
  - role: pedestrian
    kind: pedestrian
    station: true
    spawn: {x: -36.6, y: 78.0, heading: 270}                # east pavement of the avenue, facing across (west)
    bot: {path_xy: [[-59.0, 78.5]], start_s: 8, speed: 1.4, look: av1}
  - role: av_passenger
    kind: av_passenger
    station: true
    agent: av1
    bot: {ehmi: [[8, yielding], [13, go], [20, driving]]}
  - role: driver
    kind: driver
    station: true
    vehicle: vehicle.lincoln.mkz_2020
    spawn: {x: 20.0, y: 130.5, heading: 270}                # 26 m behind the AV, same street
  - role: pilot
    kind: drone
    station: true
    airframe: consumer
    mode: position
    view: fpv
    gimbal_pitch_deg: -36
    spawn: {x: -30.0, y: 95.0, heading: 225}                # east of the avenue, facing the crossing
    bot: {path_xy: [[-30.0, 95.0, 20], [-34.0, 90.0, 22]], speed: 3, start_s: 0, land: false}

agents:
  - id: av1
    kind: car
    vehicle: vehicle.tesla.model3
    color: "20,60,140"
    route_xy: [[-5.5, 130.2], [-45.0, 106.5], [-45.1, 40]]  # west along the waterfront, left into the avenue
    speed_kmh: 30
    accel: 2.0
    yield_to_pedestrians: true
    ehmi: manual
    ehmi_slots: [front, roof, road, eyes]

pois:
  - {name: crossing, x: -45.0, y: 78.0, radius_m: 12}

trials:
  - {duration_s: 45}
