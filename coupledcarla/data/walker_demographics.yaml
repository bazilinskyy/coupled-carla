# Who is on the street, by broad appearance group, per place (coupledcarla/walkerlooks.py; method and limits in
# the README, "Who the pedestrians are").
#
# Appearance is not nationality, and none of these numbers says who anyone is. They give a plausible look for a
# crowd: the share of people on a street who would broadly read as East Asian, White, Black, ... Census and
# registry tables count residents by nationality, country of birth or origin (Japan, the Netherlands, Spain,
# Switzerland, Finland), or by self-identified race and ethnicity (the US, the UK, Canada, South Africa); tourism
# statistics count visitors by country of residence. walkerlooks.py turns each count into appearance groups through
# the "mixes", "countries" and "regions" below (a Chinese national -> east_asian; a US resident -> the US mix; ...),
# then mixes residents and visitors:
#
#   street mix = (1 - v) * residents + v * visitors
#   v = present visitors / (population + present visitors) * hotspot_factor   (capped at 0.6)
#   present visitors = foreign visitor nights per year / 365
#
# Domestic visitors count as residents (they look like the country's residents). hotspot_factor (a judgment, given
# per place) says how much denser visitors are where the twin is (Shibuya crossing, Dam square) than city-wide.
#
# groups: east_asian (East and Southeast Asian), south_asian, black, white, mena (Middle Eastern / North African),
#         latin_american, mixed_unclear (mixed, Pacific, Indigenous, or no clear group).
# checked: true = read from the cited table in this session (2026-11-28); false = an approximate value from the
# named source or a judgment, not re-read; such numbers are rounded and should be checked before being quoted.
version: 2026-11-28
groups: [east_asian, south_asian, black, white, mena, latin_american, mixed_unclear]

# --- appearance mixes of named population groups (judgment, coarse) ---------------------------------------------
mixes:
  japanese_nationals:
    mix: {east_asian: 0.98, mixed_unclear: 0.02}
    note: "Japan's nationals; ~2 % allowance for mixed parentage and naturalised citizens (judgment; MHLW vital
      statistics give ~2-4 % of births with a foreign parent)."
  dutch_origin:
    mix: {white: 0.97, mixed_unclear: 0.02, black: 0.005, east_asian: 0.005}
    note: "CBS 'Nederlandse herkomst' (born in the Netherlands, both parents born there): includes grandchildren of
      migrants (judgment)."
  nl_indonesian_origin:
    mix: {mixed_unclear: 0.5, white: 0.3, east_asian: 0.2}
    note: "CBS herkomst Indonesia: mostly Indo-Dutch families of mixed European-Indonesian ancestry (judgment)."
  swiss_nationals:
    mix: {white: 0.93, mena: 0.02, south_asian: 0.01, black: 0.01, east_asian: 0.01, latin_american: 0.01,
          mixed_unclear: 0.01}
    note: "Swiss citizens incl. naturalised ones, mostly of European origin (judgment from SFSO population by
      migration status)."
  finnish_background:
    mix: {white: 0.99, mixed_unclear: 0.01}
    note: "Statistics Finland 'Finnish background' (at least one parent born in Finland) (judgment)."
  spain_born:
    mix: {white: 0.95, latin_american: 0.02, mena: 0.015, black: 0.005, east_asian: 0.005, mixed_unclear: 0.005}
    note: "Born in Spain, incl. children of immigrants (judgment)."
  ukraine_residents:
    mix: {white: 0.99, mixed_unclear: 0.01}
    note: "Chernihiv: 2001 census, Ukrainians 89.6 %, Russians 8.8 % (both read as white here) (checked: false)."
  france_non_immigrants:
    mix: {white: 0.86, mena: 0.07, black: 0.04, east_asian: 0.01, mixed_unclear: 0.02}
    note: "French residents born in France, incl. descendants of immigrants (INSEE: ~11 % of the population are
      descendants of immigrants, about half of them with an African-born parent) (judgment)."

